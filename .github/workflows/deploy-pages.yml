name: Deploy band sound generator to GitHub Pages

# Publica la app estática de band-sound-generator/ en GitHub Pages.
# Activa Pages automáticamente (enablement: true) la primera vez que se ejecuta.

on:
  push:
    branches:
      - main
      - claude/band-sound-generator-AQBk5
    paths:
      - band-sound-generator/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: band-sound-generator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
